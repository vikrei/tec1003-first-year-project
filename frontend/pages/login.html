<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Highcharts Course Portal</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages.css">
</head>

<body>

    <header class="site-header">

        <a href="index.html" class="logo">
            <img src="assets/images/logo.svg" alt="Highcharts Course Portal">
        </a>

        <nav class="header-navigation" aria-label="Main navigation">
            <a href="#help">Help</a>
            <a href="login.html">Log in / Register</a>
        </nav>

    </header>


    <main class="login-page">

        <section class="login-section">

            <h1>Log In &amp; Let’s Get You Started</h1>

            <div class="login-tabs">
                <button type="button" class="login-tab active">
                    Student Log in
                </button>

                <button type="button" class="login-tab">
                    Admin Login
                </button>
            </div>


            <form class="login-form">

                <div class="form-group">
                    <label for="username">
                        Your Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="User Name"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password">
                        Your Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        required
                    >

                    <a href="#" class="forgot-password">
                        Forgot Password?
                    </a>
                </div>


                <button type="submit" class="login-button">
                    Log in
                </button>

            </form>


            <div class="login-divider">
                <span>or</span>
            </div>


            <div class="social-login">

                <button type="button">
                    Log in with Google
                </button>

                <button type="button">
                    Log in with Facebook
                </button>

                <button type="button">
                    Log in with Apple
                </button>

            </div>

        </section>

    </main>


    <footer class="site-footer">

        <div class="social-links">
            <p>Find us on</p>

            <a href="#" aria-label="Facebook">Facebook</a>
            <a href="#" aria-label="Twitter">Twitter</a>
            <a href="#" aria-label="Instagram">Instagram</a>
            <a href="#" aria-label="Snapchat">Snapchat</a>
        </div>

        <nav class="footer-navigation" aria-label="Footer navigation">
            <a href="#" data-modal="terms">Terms</a>
            <a href="#" data-modal="support">Support</a>
            <a href="#" data-modal="about">About</a>
        </nav>

        <p class="copyright">
            © 2026 All Rights Reserved
        </p>

    </footer>

</body>

</html>
