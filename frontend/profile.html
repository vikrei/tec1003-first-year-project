<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Highcharts Course Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Vollkorn+SC:wght@800&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>

    <header class="site-header">

        <a href="student-dashboard.html" class="logo">
            <img src="assets/images/logo.svg" alt="Highcharts Course Portal">
        </a>

        <div class="header-actions">
            <button type="button" class="theme-toggle" aria-label="Toggle dark mode">
                Dark mode
            </button>

            <button type="button" class="profile-menu-button" aria-label="Open profile menu">
                <img src="assets/images/profile.jpg" alt="User profile">
            </button>
        </div>

    </header>


    <main class="profile-page">

        <a href="student-dashboard.html" class="back-link">
            ← Back
        </a>

        <section class="profile-header">

            <img
                src="assets/images/profile.jpg"
                alt="Alex Liland"
                class="profile-image"
            >

            <button type="button" class="change-image-button">
                Change Image
            </button>

            <h1>Alex Liland</h1>

        </section>


        <section class="profile-settings">

            <article class="profile-setting">
                <button type="button">
                    My Account
                </button>
            </article>

            <article class="profile-setting">
                <button type="button">
                    My Contracts
                </button>
            </article>

            <article class="profile-setting">
                <button type="button">
                    Skills &amp; Interests
                </button>
            </article>

            <article class="profile-setting">
                <button type="button">
                    App Preferences
                </button>
            </article>

            <article class="profile-setting">
                <button type="button">
                    Support
                </button>
            </article>

            <article class="profile-setting">
                <button type="button">
                    Terms &amp; Privacy
                </button>
            </article>

            <article class="profile-setting">
                <button type="button">
                    About the App
                </button>
            </article>

        </section>


        <button type="button" class="save-profile-button">
            Save Changes
        </button>

        <button type="button" class="logout-button">
            Log Out
        </button>

    </main>


    <button type="button" class="ask-ai-button">
        Ask AI
    </button>


    <nav class="bottom-navigation" aria-label="Student navigation">

        <a href="student-dashboard.html">
            Home
        </a>

        <a href="my-courses.html">
            My Courses
        </a>

        <a href="inbox.html">
            Inbox
        </a>

        <a href="profile.html" class="active">
            Profile
        </a>

    </nav>


    <footer class="site-footer">

        <div class="social-links">
            <p>Find us on</p>

            <a href="#" aria-label="Facebook">Facebook</a>
            <a href="#" aria-label="Twitter">Twitter</a>
            <a href="#" aria-label="Instagram">Instagram</a>
            <a href="#" aria-label="Snapchat">Snapchat</a>
        </div>

        <nav class="footer-navigation" aria-label="Footer navigation">
            <a href="#" data-modal="terms">Terms</a>
            <a href="#" data-modal="support">Support</a>
            <a href="#" data-modal="about">About</a>
        </nav>

        <p class="copyright">
            © 2026 All Rights Reserved
        </p>

    </footer>

</body>

</html>
